name: test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m build
      - run: python benchmarks/benchmark_espeak.py --quick --suite core --candidate cli --reference-source golden --golden benchmarks/goldens/espeak_ipa3_en-us.json --format summary

  espeak-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install --yes espeak-ng libespeak-ng-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -m espeak tests/test_clause_backend.py tests/test_espeak_exact_contract.py tests/test_real_optional_integration.py
      - run: ruff check .
      - run: python -m build

  lexicons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,lexicons]'
      - run: pytest -q tests/test_lexicon_adapters.py tests/test_lexicon_spans.py tests/test_lexicon_overlay.py tests/test_lexicon_overlay_extra.py tests/test_real_optional_integration.py
      - run: ruff check .

  direct-g2lex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,g2lex]'
      - run: pytest -q tests/test_lexicon_adapters.py tests/test_real_optional_integration.py
      - run: ruff check .

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python benchmarks/benchmark_reference.py --output reference-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-report
          path: reference-report.json

  artifact:
    needs: [core, direct-g2lex, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: rm -rf dist && python -m build
      - run: python tools/check_release_artifacts.py dist
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/piperg2p-wheel-test
      - run: /tmp/piperg2p-wheel-test/bin/python -m pip install --no-deps dist/*.whl
      - run: >-
          /tmp/piperg2p-wheel-test/bin/python -c
          "from importlib.metadata import version; import piperg2p; assert piperg2p.__version__ == version('piperg2p'); print(piperg2p.__version__)"
      - run: >-
          /tmp/piperg2p-wheel-test/bin/python -c
          "from piperg2p import PiperFrontend, VoiceConfig; print(PiperFrontend(VoiceConfig.from_dict({'phoneme_type': 'text', 'num_symbols': 4, 'num_speakers': 1, 'audio': {'sample_rate': 22050}, 'phoneme_id_map': {'_': 0, '^': 1, '$': 2, 'a': 3}})).phonemize('a').ids)"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Verify release version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          python tools/check_release_artifacts.py dist --expected-version "$expected"
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
